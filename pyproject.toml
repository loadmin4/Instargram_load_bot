[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insta-finder"
version = "0.1.0"
description = "사진으로 인스타그램 게시물과 올린 사용자를 찾는 봇 (Google Lens 역이미지 검색)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.0,<23"]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
insta-finder = "insta_finder.cli:main"
insta-finder-bot = "insta_finder.telegram_bot:main"

[tool.setuptools]
packages = ["insta_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
